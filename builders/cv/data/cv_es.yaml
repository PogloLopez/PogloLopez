          manuales y optimizar el monitoreo de fallas, con una reducción estimada de \~4 horas
          semanales de carga operativa por usuario en los equipos de TI y Planeación.
      - lead: 'Gobernanza y DevSecOps'
        text: >-
          Establecí el ecosistema de desarrollo empresarial en *GitHub*, implementando reglas de
